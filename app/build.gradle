plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.opencvcamerastream'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.opencvcamerastream"
        minSdk 21
        targetSdk 29  // Target Android 10 for enhanced privacy and security features
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Android 10 compatibility configurations
        vectorDrawables.useSupportLibrary = true
        
        // NDK configuration for OpenCV native libraries
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        
        // Configure native library loading to use shared C++ standard library (required by OpenCV)
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Enable debugging for Android 10 testing
            debuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // Android 10 scoped storage compliance
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libopencv_java4.so'
        pickFirst '**/libopencv_java3.so'
        
        // Ensure native libraries are not stripped
        doNotStrip '**/libc++_shared.so'
        doNotStrip '**/libopencv_java4.so'
    }
    
    // Native libraries are now included only from app module (moved from OpenCV module during CI/CD)
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    
    lint {
        // Configure lint for CI/CD
        abortOnError false
        
        // Create baseline for existing issues
        baseline = file("lint-baseline.xml")
        
        // Enable important Android 10 compliance checks
        enable 'NewApi', 'InlinedApi', 'PrivacyLeakage'
        
        // Generate reports
        htmlReport true
        xmlReport true
        
        // Treat warnings as informational in CI
        warningsAsErrors false
    }
}

dependencies {
    // Core Android dependencies
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // OpenCV Android SDK
    implementation project(':opencv')
    
    // Unit testing dependencies (optimized versions)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test:core-ktx:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    // Android instrumentation testing dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
}

// Test coverage configuration
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.8"
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
    ]
    
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: "$buildDir", includes: [
        "jacoco/testDebugUnitTest.exec",
        "outputs/code-coverage/connected/*coverage.ec"
    ]))
}

// ============================================================================
// Build-time Library Validation Task
// ============================================================================
// Validates that all required OpenCV native libraries are present before APK packaging
// Requirements: Req-1 (library inclusion), Req-5 (robust acquisition system)

task validateNativeLibraries {
    description = 'Validates that all required OpenCV native libraries are present for all supported architectures'
    group = 'verification'
    
    doLast {
        println "\n=========================================="
        println "Native Library Validation"
        println "==========================================\n"
        
        // Define required libraries
        def requiredLibraries = [
            'libc++_shared.so',
            'libopencv_java4.so'
        ]
        
        // Define supported architectures (from defaultConfig.ndk.abiFilters)
        def supportedArchitectures = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        
        // Check both app and opencv module jniLibs directories
        def jniLibsDirs = [
            file("${project.projectDir}/src/main/jniLibs"),
            file("${project.rootProject.projectDir}/opencv/src/main/jniLibs")
        ]
        
        def validationErrors = []
        def validationWarnings = []
        def foundLibraries = [:]
        
        // Track which libraries are found in which locations
        supportedArchitectures.each { arch ->
            foundLibraries[arch] = [:]
            requiredLibraries.each { lib ->
                foundLibraries[arch][lib] = []
            }
        }
        
        // Scan all jniLibs directories
        jniLibsDirs.each { jniLibsDir ->
            if (jniLibsDir.exists()) {
                supportedArchitectures.each { arch ->
                    def archDir = new File(jniLibsDir, arch)
                    if (archDir.exists()) {
                        requiredLibraries.each { lib ->
                            def libFile = new File(archDir, lib)
                            if (libFile.exists() && libFile.length() > 0) {
                                foundLibraries[arch][lib] << jniLibsDir.path
                            }
                        }
                    }
                }
            }
        }
        
        // Validate findings
        supportedArchitectures.each { arch ->
            requiredLibraries.each { lib ->
                def locations = foundLibraries[arch][lib]
                
                if (locations.isEmpty()) {
                    validationErrors << "Missing library: ${lib} for architecture: ${arch}"
                } else if (locations.size() > 1) {
                    validationWarnings << "Duplicate library: ${lib} for architecture: ${arch} found in multiple locations: ${locations.join(', ')}"
                }
            }
        }
        
        // Print detailed results
        println "Validation Results:"
        println "-------------------"
        
        supportedArchitectures.each { arch ->
            println "\n${arch}:"
            requiredLibraries.each { lib ->
                def locations = foundLibraries[arch][lib]
                if (locations.isEmpty()) {
                    println "  ❌ ${lib}: NOT FOUND"
                } else if (locations.size() == 1) {
                    def location = locations[0].replace(project.rootProject.projectDir.path, '')
                    println "  ✅ ${lib}: Found in ${location}"
                } else {
                    println "  ⚠️  ${lib}: Found in multiple locations (${locations.size()})"
                }
            }
        }
        
        // Print warnings
        if (!validationWarnings.isEmpty()) {
            println "\n⚠️  Warnings:"
            validationWarnings.each { warning ->
                println "  - ${warning}"
            }
            println "\nNote: Duplicate libraries will be handled by packagingOptions.pickFirst"
        }
        
        // Print errors and fail if necessary
        if (!validationErrors.isEmpty()) {
            println "\n❌ Validation Failed!"
            println "\nErrors:"
            validationErrors.each { error ->
                println "  - ${error}"
            }
            
            println "\n=========================================="
            println "SOLUTION: Run the library acquisition script"
            println "==========================================\n"
            println "The required OpenCV native libraries are missing."
            println "Please run one of the following scripts to download them:\n"
            println "  Linux/Mac:  ./scripts/download-opencv-libs-only.sh"
            println "  Windows:    .\\scripts\\download-opencv-libs-only.ps1"
            println "  Or:         ./scripts/setup-opencv.sh\n"
            println "These scripts will download and extract the OpenCV Android SDK"
            println "and place the native libraries in the correct directories.\n"
            println "After running the script, rebuild your project."
            println "==========================================\n"
            
            throw new GradleException("Native library validation failed. See error messages above.")
        }
        
        println "\n✅ All required native libraries are present!"
        println "==========================================\n"
    }
}

// Hook the validation task into the build process
// Run before any packaging tasks (assembleDebug, assembleRelease, etc.)
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('package') || task.name.startsWith('assemble')) {
        task.dependsOn validateNativeLibraries
    }
}