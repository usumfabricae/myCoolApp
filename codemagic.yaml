          fi
          
          # Validate resources
          echo "Validating Android resources..."
          if ! $GRADLE_EXECUTABLE processDebugResources --stacktrace --info; then
            echo "❌ Resource processing failed"
            echo "=== RESOURCE PROCESSING TROUBLESHOOTING ==="
            
            # Check for common resource issues
            echo "Checking layout files..."
            find app/src/main/res/layout -name "*.xml" -exec echo "Layout: {}" \;
            
            echo "Checking drawable files..."
            find app/src/main/res/drawable -name "*.xml" -exec echo "Drawable: {}" \;
            
            echo "Checking values files..."
            find app/src/main/res/values -name "*.xml" -exec echo "Values: {}" \;
            
            exit 1
          else
