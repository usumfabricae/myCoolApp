definitions:
  env_versions: &env_versions
    java: 17
    
  common_cache: &common_cache
    cache_paths:
      - ~/.gradle/caches
      - ~/.android/build-cache
      - ~/.m2/repository
      
  common_environment: &common_environment
    vars:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      JAVA_TOOL_OPTIONS: -Xmx4g
      # Build environment debugging
      CM_VERBOSE: true
    
workflows:
  android-development-workflow:
    name: Android Development Build (Java 17 + AGP 8.1.2)
    # Build trigger: Fixed test runtime failures - added error handling for missing dependencies in test environment
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      <<: *env_versions
      <<: *common_environment
      vars:
        GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
        JAVA_TOOL_OPTIONS: -Xmx4g
        CM_VERBOSE: true
        # Android signing configuration (for release builds)
        # KEYSTORE: Encrypted(...)  # Add your keystore if needed
        # KEYSTORE_PASSWORD: Encrypted(...)
        # KEY_ALIAS: Encrypted(...)
        # KEY_PASSWORD: Encrypted(...)
      # groups:
        # Add environment variable groups if needed
        # - keystore_credentials
    cache:
      <<: *common_cache
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
        - pattern: 'feature/*'
          include: true
          source: true
    scripts:
      - name: Comprehensive build environment debugging
        script: |
          echo "=== COMPREHENSIVE BUILD ENVIRONMENT DEBUG ==="
          echo "Build ID: $CM_BUILD_ID"
          echo "Build directory: $CM_BUILD_DIR"
          echo "Current working directory: $(pwd)"
          echo "Java version: $(java -version 2>&1)"
          echo "Gradle version: $(gradle --version 2>&1 | head -5)"
          echo "Android SDK root: $ANDROID_SDK_ROOT"
          echo "Available memory: $(free -h 2>/dev/null || vm_stat)"
          echo ""
          echo "=== REPOSITORY STRUCTURE ANALYSIS ==="
          echo "Repository root contents:"
          ls -la $CM_BUILD_DIR
          echo ""
          echo "=== DYNAMIC PROJECT DISCOVERY ==="
          echo "Searching for Android project indicators..."
          
          # Find all build.gradle files
          echo "All build.gradle files found:"
          find $CM_BUILD_DIR -name "build.gradle" -type f 2>/dev/null | while read file; do
            echo "  - $file"
            if grep -q "com.android.application\|com.android.library" "$file" 2>/dev/null; then
              echo "    ✅ Contains Android plugin"
            fi
          done
          
          # Find all settings.gradle files
          echo ""
          echo "All settings.gradle files found:"
          find $CM_BUILD_DIR -name "settings.gradle" -type f 2>/dev/null | while read file; do
            echo "  - $file"
          done
          
          # Find all gradlew files
          echo ""
          echo "All gradlew files found:"
          find $CM_BUILD_DIR -name "gradlew" -type f 2>/dev/null | while read file; do
            echo "  - $file"
            if [ -x "$file" ]; then
              echo "    ✅ Executable"
            else
              echo "    ❌ Not executable"
            fi
          done
          
          echo ""
          echo "=== DIRECTORY TREE ANALYSIS ==="
          echo "Directory structure (max depth 4):"
          find $CM_BUILD_DIR -maxdepth 4 -type d | sort | head -30
      
      - name: Dynamic project discovery and setup
        script: |
          echo "=== DYNAMIC ANDROID PROJECT DISCOVERY ==="
          
          # Initialize environment file
          echo "# Codemagic Android Build Environment" > $CM_BUILD_DIR/android_env.sh
          echo "export CM_BUILD_ID='$CM_BUILD_ID'" >> $CM_BUILD_DIR/android_env.sh
          echo "export CM_COMMIT='$CM_COMMIT'" >> $CM_BUILD_DIR/android_env.sh
          echo "export CM_BRANCH='$CM_BRANCH'" >> $CM_BUILD_DIR/android_env.sh
          echo "export BUILD_TIMESTAMP='$(date -u +%Y-%m-%dT%H:%M:%SZ)'" >> $CM_BUILD_DIR/android_env.sh
          
          # Smart project discovery - look for Android project indicators
          echo "Searching for Android project root..."
          
          # Strategy 1: Look for settings.gradle with Android modules
          SETTINGS_GRADLE_PATH=$(find $CM_BUILD_DIR -name "settings.gradle" -type f | while read file; do
            if grep -q "include.*:app\|include.*:opencv" "$file" 2>/dev/null; then
              echo "$file"
              break
            fi
          done | head -1)
          
          if [ -n "$SETTINGS_GRADLE_PATH" ]; then
            ANDROID_PROJECT_DIR=$(dirname "$SETTINGS_GRADLE_PATH")
            echo "✅ Found Android project via settings.gradle at: $ANDROID_PROJECT_DIR"
          else
            # Strategy 2: Look for build.gradle with Android plugins
            BUILD_GRADLE_PATH=$(find $CM_BUILD_DIR -name "build.gradle" -type f | while read file; do
              if grep -q "com.android.application\|android {" "$file" 2>/dev/null && ! echo "$file" | grep -q "/app/build.gradle"; then
                echo "$file"
                break
              fi
            done | head -1)
            
            if [ -n "$BUILD_GRADLE_PATH" ]; then
              ANDROID_PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
              echo "✅ Found Android project via build.gradle at: $ANDROID_PROJECT_DIR"
            else
              # Strategy 3: Look for common Android project structure
              if [ -d "$CM_BUILD_DIR/myCoolApp" ] && [ -f "$CM_BUILD_DIR/myCoolApp/build.gradle" ]; then
                ANDROID_PROJECT_DIR="$CM_BUILD_DIR/myCoolApp"
                echo "✅ Found Android project via known structure at: $ANDROID_PROJECT_DIR"
              else
                echo "❌ Could not locate Android project directory"
                echo "Available directories:"
                find $CM_BUILD_DIR -maxdepth 2 -type d | sort
                exit 1
              fi
            fi
          fi
          
          # Export project directory
          echo "export ANDROID_PROJECT_DIR='$ANDROID_PROJECT_DIR'" >> $CM_BUILD_DIR/android_env.sh
          
          # Validate project structure
          cd "$ANDROID_PROJECT_DIR"
          echo "Validating Android project structure..."
          
          # Check for essential files
          if [ ! -f "build.gradle" ]; then
            echo "❌ build.gradle not found in project root"
            exit 1
          fi
          
          if [ ! -f "settings.gradle" ]; then
            echo "❌ settings.gradle not found in project root"
            exit 1
          fi
          
          if [ ! -d "app" ]; then
            echo "❌ app module directory not found"
            exit 1
          fi
          
          echo "✅ Android project structure validated"
          
          # Set up local.properties with comprehensive SDK configuration
          echo "Setting up local.properties..."
          echo "# Automatically generated by Codemagic CI/CD" > "local.properties"
          echo "sdk.dir=\$ANDROID_SDK_ROOT" >> "local.properties"
          echo "ndk.dir=\$ANDROID_NDK_ROOT" >> "local.properties"
          echo "cmake.dir=\$ANDROID_CMAKE_ROOT" >> "local.properties"
          echo "✅ Created local.properties with SDK paths"
          
          # Automated Gradle wrapper setup
          echo "=== AUTOMATED GRADLE WRAPPER SETUP ==="
          if [ -f "scripts/setup-gradle-wrapper.sh" ]; then
            echo "Running automated Gradle wrapper setup..."
            chmod +x scripts/setup-gradle-wrapper.sh
            if ./scripts/setup-gradle-wrapper.sh; then
              echo "✅ Gradle wrapper setup completed successfully"
            else
              echo "⚠️  Gradle wrapper setup script failed, continuing with system gradle"
            fi
          else
            echo "No Gradle wrapper setup script found, checking existing wrapper..."
          fi
          
          # Flexible gradle execution setup
          echo "=== FLEXIBLE GRADLE EXECUTION CONFIGURATION ==="
          GRADLE_EXECUTABLE=""
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Testing gradlew functionality..."
            if ./gradlew --version >/dev/null 2>&1; then
              GRADLE_EXECUTABLE="./gradlew"
              echo "✅ Using project gradlew wrapper"
            else
              echo "⚠️  gradlew exists but not functional"
            fi
          fi
          
          if [ -z "$GRADLE_EXECUTABLE" ]; then
            if command -v gradle >/dev/null 2>&1; then
              GRADLE_EXECUTABLE="gradle"
              echo "✅ Using system gradle"
            else
              echo "❌ No working gradle executable found"
              exit 1
            fi
          fi
          
          echo "export GRADLE_EXECUTABLE='$GRADLE_EXECUTABLE'" >> $CM_BUILD_DIR/android_env.sh
          echo "Selected gradle executable: $GRADLE_EXECUTABLE"
          
          # Verify Gradle and Java compatibility
          echo "=== JAVA 17 AND GRADLE COMPATIBILITY VERIFICATION ==="
          echo "Java version details:"
          java -version
          echo ""
          echo "Gradle version details:"
          $GRADLE_EXECUTABLE --version
          echo ""
          
          # Verify Android Gradle Plugin compatibility
          echo "Checking Android Gradle Plugin version..."
          if grep -q "com.android.application.*8\.1\.2" build.gradle; then
            echo "✅ Android Gradle Plugin 8.1.2 confirmed"
          else
            echo "⚠️  Android Gradle Plugin version may not be 8.1.2"
            grep "com.android.application" build.gradle || echo "Could not find AGP version"
          fi
          
          # Final project structure verification
          echo "=== FINAL PROJECT STRUCTURE ==="
          echo "Project root: $ANDROID_PROJECT_DIR"
          echo "Contents:"
          ls -la "$ANDROID_PROJECT_DIR"
      
      - name: Validate centralized repository configuration
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== CENTRALIZED REPOSITORY VALIDATION ==="
          echo "Checking settings.gradle repository configuration..."
          
          if grep -q "FAIL_ON_PROJECT_REPOS" settings.gradle; then
            echo "✅ FAIL_ON_PROJECT_REPOS mode is configured"
          else
            echo "❌ FAIL_ON_PROJECT_REPOS mode not found in settings.gradle"
            exit 1
          fi
          
          if grep -q "google()" settings.gradle && grep -q "mavenCentral()" settings.gradle; then
            echo "✅ Required repositories (Google, Maven Central) configured in settings.gradle"
          else
            echo "❌ Required repositories not properly configured in settings.gradle"
            exit 1
          fi
          
          # Check that project-level build.gradle doesn't have conflicting repositories
          echo "Validating project-level repository configuration..."
          if grep -A 10 -B 2 "repositories {" build.gradle | grep -v "^--$" | grep -q "google()\|mavenCentral()"; then
            echo "⚠️  Found repositories in project-level build.gradle - this may conflict with FAIL_ON_PROJECT_REPOS"
            echo "Repository configuration in build.gradle:"
            grep -A 10 -B 2 "repositories {" build.gradle | grep -v "^--$"
          else
            echo "✅ No conflicting repositories found in project-level build.gradle"
          fi
          
          echo "✅ Repository configuration validation completed"
      
      - name: Resolve dependencies with error handling
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== DEPENDENCY RESOLUTION WITH COMPREHENSIVE ERROR HANDLING ==="
          echo "Using gradle executable: $GRADLE_EXECUTABLE"
          
          # Attempt dependency resolution with detailed error reporting
          if ! $GRADLE_EXECUTABLE dependencies --stacktrace --info; then
            echo "❌ Dependency resolution failed"
            echo "=== DEPENDENCY RESOLUTION TROUBLESHOOTING ==="
            
            # Check network connectivity
            echo "Testing network connectivity..."
            if curl -s --connect-timeout 10 https://repo1.maven.org/maven2/ >/dev/null; then
              echo "✅ Maven Central accessible"
            else
              echo "❌ Maven Central not accessible"
            fi
            
            if curl -s --connect-timeout 10 https://dl.google.com/dl/android/maven2/ >/dev/null; then
              echo "✅ Google Maven accessible"
            else
              echo "❌ Google Maven not accessible"
            fi
            
            # Check Gradle daemon status
            echo "Gradle daemon status:"
            $GRADLE_EXECUTABLE --status || echo "No Gradle daemons running"
            
            # Try with offline mode disabled and refresh dependencies
            echo "Attempting dependency refresh..."
            $GRADLE_EXECUTABLE dependencies --refresh-dependencies --stacktrace || echo "Dependency refresh failed"
            
            exit 1
          else
            echo "✅ Dependencies resolved successfully"
          fi
      
      - name: Download and setup OpenCV Android SDK
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== SETTING UP OPENCV ANDROID SDK USING SETUP SCRIPT ==="
          
          # Make the setup script executable
          if [ -f "scripts/setup-opencv.sh" ]; then
            chmod +x scripts/setup-opencv.sh
            echo "✅ Found OpenCV setup script"
            
            # Run the setup script with enhanced error reporting
            if ./scripts/setup-opencv.sh; then
              echo "✅ OpenCV setup script completed successfully"
              
              # Immediate verification of setup results
              echo "Verifying OpenCV setup results..."
              JAVA_FILES=$(find opencv/src/main/java -name "*.java" | wc -l)
              NATIVE_LIBS=$(find opencv/src/main/jniLibs -name "*.so" | wc -l)
              
              echo "Java files installed: $JAVA_FILES"
              echo "Native libraries installed: $NATIVE_LIBS"
              
              if [ "$JAVA_FILES" -eq 0 ] || [ "$NATIVE_LIBS" -eq 0 ]; then
                echo "❌ OpenCV setup incomplete - missing files"
                echo "Java directory contents:"
                find opencv/src/main/java -type f | head -5
                echo "Native libs directory contents:"
                find opencv/src/main/jniLibs -type f | head -5
                exit 1
              fi
              
              # Verify specific required files
              if [ ! -f "opencv/src/main/java/org/opencv/core/Mat.java" ]; then
                echo "❌ Critical OpenCV class Mat.java not found"
                exit 1
              fi
              
              if ! find opencv/src/main/jniLibs -name "libopencv_java4.so" | grep -q .; then
                echo "❌ Critical native library libopencv_java4.so not found"
                exit 1
              fi
              
              echo "✅ OpenCV setup verification passed"
              
              # Immediately download libc++_shared.so after OpenCV setup
              echo "=== DOWNLOADING LIBC++_SHARED.SO IMMEDIATELY ==="
              
              # Always attempt download for ARM architectures
              TEMP_LIBC_DIR="$CM_BUILD_DIR/temp-libc-immediate"
              mkdir -p "$TEMP_LIBC_DIR"
              cd "$TEMP_LIBC_DIR"
              
              for arch_name in "arm64-v8a" "armeabi-v7a"; do
                echo "Downloading libc++_shared.so for $arch_name..."
                
                DOWNLOAD_SUCCESS=false
                
                # Try direct download from reliable sources
                case "$arch_name" in
                  "arm64-v8a")
                    DOWNLOAD_URLS=(
                      "https://github.com/android/ndk/raw/main/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so"
                      "https://raw.githubusercontent.com/android/ndk/main/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so"
                    )
                    ;;
                  "armeabi-v7a")
                    DOWNLOAD_URLS=(
                      "https://github.com/android/ndk/raw/main/sources/cxx-stl/llvm-libc++/libs/armeabi-v7a/libc++_shared.so"
                      "https://raw.githubusercontent.com/android/ndk/main/sources/cxx-stl/llvm-libc++/libs/armeabi-v7a/libc++_shared.so"
                    )
                    ;;
                esac
                
                # Try each URL
                for url in "${DOWNLOAD_URLS[@]}"; do
                  echo "  Trying: $url"
                  if curl -L -f -o "libc++_shared_${arch_name}.so" "$url" 2>/dev/null; then
                    if [ -f "libc++_shared_${arch_name}.so" ] && [ -s "libc++_shared_${arch_name}.so" ]; then
                      file_size=$(stat -c%s "libc++_shared_${arch_name}.so" 2>/dev/null || stat -f%z "libc++_shared_${arch_name}.so" 2>/dev/null || echo "0")
                      
                      # Verify reasonable size and ELF format
                      if [ "$file_size" -gt 100000 ]; then
                        if file "libc++_shared_${arch_name}.so" | grep -q "ELF.*shared object"; then
                          # Ensure target directory exists
                          mkdir -p "$ANDROID_PROJECT_DIR/opencv/src/main/jniLibs/$arch_name"
                          
                          # Copy to OpenCV module
                          cp "libc++_shared_${arch_name}.so" "$ANDROID_PROJECT_DIR/opencv/src/main/jniLibs/$arch_name/libc++_shared.so"
                          chmod 644 "$ANDROID_PROJECT_DIR/opencv/src/main/jniLibs/$arch_name/libc++_shared.so"
                          
                          echo "  ✅ Successfully downloaded libc++_shared.so for $arch_name ($file_size bytes)"
                          DOWNLOAD_SUCCESS=true
                          break
                        else
                          echo "  ❌ Downloaded file is not a valid ELF binary"
                        fi
                      else
                        echo "  ❌ Downloaded file too small ($file_size bytes)"
                      fi
                    fi
                  else
                    echo "  ❌ Download failed"
                  fi
                done
                
                if [ "$DOWNLOAD_SUCCESS" = false ]; then
                  echo "  ⚠️  Failed to download libc++_shared.so for $arch_name"
                fi
              done
              
              # Clean up and return to project directory
              cd "$ANDROID_PROJECT_DIR"
              rm -rf "$TEMP_LIBC_DIR"
              
              # Verify what we have now
              echo "Immediate download verification:"
              for arch_name in "arm64-v8a" "armeabi-v7a"; do
                if [ -f "opencv/src/main/jniLibs/$arch_name/libc++_shared.so" ]; then
                  libc_size=$(stat -c%s "opencv/src/main/jniLibs/$arch_name/libc++_shared.so" 2>/dev/null || stat -f%z "opencv/src/main/jniLibs/$arch_name/libc++_shared.so" 2>/dev/null || echo "0")
                  echo "  $arch_name: $libc_size bytes"
                else
                  echo "  $arch_name: NOT FOUND"
                fi
              done
            else
              echo "❌ OpenCV setup script failed"
              echo "Checking for partial setup..."
              ls -la opencv/src/main/ || echo "OpenCV main directory not accessible"
              exit 1
            fi
          else
            echo "❌ OpenCV setup script not found at scripts/setup-opencv.sh"
            echo "Available files in scripts directory:"
            ls -la scripts/ || echo "Scripts directory not found"
            exit 1
          fi
      
      - name: Validate OpenCV integration
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"

          echo "=== OPENCV INTEGRATION VALIDATION ==="

          # Check OpenCV module structure
          if [ -d "opencv" ]; then
            echo "✅ OpenCV module directory found"
            echo "OpenCV module contents:"
            ls -la opencv/
            
            if [ -f "opencv/build.gradle" ]; then
              echo "✅ OpenCV build.gradle found"
            else
              echo "❌ OpenCV build.gradle not found"
              exit 1
            fi
            
            if [ -d "opencv/src/main/java" ]; then
              echo "✅ OpenCV Java source directory found"
              JAVA_FILES_COUNT=$(find opencv/src/main/java -name "*.java" | wc -l)
              echo "Java files found: $JAVA_FILES_COUNT"
              if [ "$JAVA_FILES_COUNT" -gt 0 ]; then
                echo "✅ OpenCV Java sources are present"
              else
                echo "❌ No OpenCV Java sources found"
                exit 1
              fi
            else
              echo "❌ OpenCV Java source directory not found"
              exit 1
            fi
            
            if [ -d "opencv/src/main/jniLibs" ]; then
              echo "✅ OpenCV native libraries directory found"
              NATIVE_LIBS_COUNT=$(find opencv/src/main/jniLibs -name "*.so" | wc -l)
              echo "Native libraries found: $NATIVE_LIBS_COUNT"
              if [ "$NATIVE_LIBS_COUNT" -gt 0 ]; then
                echo "✅ OpenCV native libraries are present"
                
                # Validate specific required libraries
                echo "Validating required OpenCV libraries..."
                
                # Check for OpenCV core library (must be present)
                if find opencv/src/main/jniLibs -name "libopencv_java4.so" | grep -q .; then
                  echo "✅ Required library found: libopencv_java4.so"
                else
                  echo "❌ Missing required library: libopencv_java4.so"
                  exit 1
                fi
                
                # Add libc++_shared.so from Android NDK with enhanced ARM device support
                echo "Adding libc++_shared.so from Android NDK (OpenCV requires dynamic linking)..."
                
                FOUND_ANY_LIBC=false
                
                # Enhanced NDK detection and libc++_shared.so extraction
                echo "=== SEARCHING FOR LIBC++_SHARED.SO IN NDK ==="
                
                # Fix NDK environment variable detection
                if [ -z "$ANDROID_NDK_ROOT" ] && [ -n "$NDK_HOME" ]; then
                  export ANDROID_NDK_ROOT="$NDK_HOME"
                  echo "Using NDK_HOME as ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
                elif [ -z "$ANDROID_NDK_ROOT" ] && [ -n "$ANDROID_NDK_HOME" ]; then
                  export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
                  echo "Using ANDROID_NDK_HOME as ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
                fi
                
                if [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
                  echo "Android NDK found at: $ANDROID_NDK_ROOT"
                  NDK_VERSION=$(cat "$ANDROID_NDK_ROOT/source.properties" 2>/dev/null | grep 'Pkg.Revision' | cut -d'=' -f2 | tr -d ' ' || echo 'Unknown')
                  echo "NDK version: $NDK_VERSION"
                  
                  # Show NDK directory structure for debugging
                  echo "Searching for libc++_shared.so in NDK..."
                  NDK_LIBC_FILES=$(find "$ANDROID_NDK_ROOT" -name "libc++_shared.so" 2>/dev/null)
                  if [ -n "$NDK_LIBC_FILES" ]; then
                    echo "Found libc++_shared.so files in NDK:"
                    echo "$NDK_LIBC_FILES"
                  else
                    echo "❌ No libc++_shared.so files found in NDK"
                  fi
                  
                  # Also check for alternative paths
                  echo "Checking alternative NDK paths..."
                  find "$ANDROID_NDK_ROOT" -path "*/sources/cxx-stl/*" -name "*.so" | head -5 || echo "No C++ STL libraries found"
                  find "$ANDROID_NDK_ROOT" -path "*/toolchains/llvm/*" -name "libc++*" | head -5 || echo "No LLVM libc++ libraries found"
                else
                  echo "❌ Android NDK not found or ANDROID_NDK_ROOT not set"
                  echo "ANDROID_NDK_ROOT: ${ANDROID_NDK_ROOT:-'not set'}"
                  echo "Available environment variables:"
                  env | grep -i ndk || echo "No NDK-related environment variables found"
                fi
                
                for arch_dir in opencv/src/main/jniLibs/*/; do
                  if [ -d "$arch_dir" ]; then
                      arch_name=$(basename "$arch_dir")
                      echo "Processing architecture: $arch_name"
                      
                      # Enhanced NDK paths for each architecture (covering more NDK versions)
                      case "$arch_name" in
                        "arm64-v8a")
                          NDK_PATHS=(
                            "$ANDROID_NDK_ROOT/sources/cxx-stl/llvm-libc++/libs/$arch_name/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/darwin-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
                          )
                          ;;
                        "armeabi-v7a")
                          NDK_PATHS=(
                            "$ANDROID_NDK_ROOT/sources/cxx-stl/llvm-libc++/libs/$arch_name/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/darwin-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so"
                          )
                          ;;
                        "x86")
                          NDK_PATHS=(
                            "$ANDROID_NDK_ROOT/sources/cxx-stl/llvm-libc++/libs/$arch_name/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/darwin-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/sysroot/usr/lib/i686-linux-android/libc++_shared.so"
                          )
                          ;;
                        "x86_64")
                          NDK_PATHS=(
                            "$ANDROID_NDK_ROOT/sources/cxx-stl/llvm-libc++/libs/$arch_name/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/darwin-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so"
                            "$ANDROID_NDK_ROOT/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so"
                          )
                          ;;
                        *)
                          echo "⚠️  Unknown architecture: $arch_name, skipping"
                          continue
                          ;;
                      esac
                      
                      # Try each NDK path and validate the binary with architecture checking
                      FOUND_FOR_ARCH=false
                      for ndk_path in "${NDK_PATHS[@]}"; do
                        if [ -f "$ndk_path" ]; then
                          echo "  Found candidate at: $ndk_path"
                          
                          # Validate that it's a proper ELF binary with correct architecture
                          file_info=$(file "$ndk_path")
                          if echo "$file_info" | grep -q "ELF.*shared object"; then
                            # Additional architecture validation
                            case "$arch_name" in
                              "arm64-v8a")
                                if echo "$file_info" | grep -q "ARM aarch64\|64-bit.*ARM"; then
                                  echo "  ✅ Correct ARM64 architecture detected"
                                  arch_valid=true
                                else
                                  echo "  ❌ Wrong architecture for ARM64: $file_info"
                                  arch_valid=false
                                fi
                                ;;
                              "armeabi-v7a")
                                if echo "$file_info" | grep -q "ARM.*EABI5\|32-bit.*ARM" && ! echo "$file_info" | grep -q "64-bit"; then
                                  echo "  ✅ Correct ARMv7 architecture detected"
                                  arch_valid=true
                                else
                                  echo "  ❌ Wrong architecture for ARMv7: $file_info"
                                  arch_valid=false
                                fi
                                ;;
                              "x86")
                                if echo "$file_info" | grep -q "Intel 80386\|32-bit.*80386" && ! echo "$file_info" | grep -q "64-bit"; then
                                  echo "  ✅ Correct x86 architecture detected"
                                  arch_valid=true
                                else
                                  echo "  ❌ Wrong architecture for x86: $file_info"
                                  arch_valid=false
                                fi
                                ;;
                              "x86_64")
                                if echo "$file_info" | grep -q "x86-64\|64-bit.*x86"; then
                                  echo "  ✅ Correct x86_64 architecture detected"
                                  arch_valid=true
                                else
                                  echo "  ❌ Wrong architecture for x86_64: $file_info"
                                  arch_valid=false
                                fi
                                ;;
                              *)
                                arch_valid=true  # Unknown arch, assume valid
                                ;;
                            esac
                            
                            if [ "$arch_valid" = true ]; then
                              cp "$ndk_path" "$arch_dir/libc++_shared.so"
                              
                              # Verify the copied file is also valid and has correct architecture
                              copied_file_info=$(file "$arch_dir/libc++_shared.so")
                              if echo "$copied_file_info" | grep -q "ELF.*shared object"; then
                                file_size=$(stat -c%s "$arch_dir/libc++_shared.so" 2>/dev/null || stat -f%z "$arch_dir/libc++_shared.so" 2>/dev/null || echo "unknown")
                                echo "✅ Added valid libc++_shared.so for $arch_name ($file_size bytes)"
                                echo "  Architecture: $(echo "$copied_file_info" | cut -d: -f2 | xargs)"
                                FOUND_FOR_ARCH=true
                                FOUND_ANY_LIBC=true
                                break
                              else
                                echo "❌ Copied file is not valid ELF binary for $arch_name"
                                rm -f "$arch_dir/libc++_shared.so"
                              fi
                            fi
                          else
                            echo "⚠️  File at $ndk_path is not a valid ELF binary"
                          fi
                        fi
                      done
                      
                      if [ "$FOUND_FOR_ARCH" = false ]; then
                        echo "⚠️  Could not find valid libc++_shared.so for $arch_name in NDK"
                        echo "  Searched paths:"
                        for ndk_path in "${NDK_PATHS[@]}"; do
                          echo "    $ndk_path $([ -f "$ndk_path" ] && echo '[EXISTS]' || echo '[NOT FOUND]')"
                        done
                      fi
                    fi
                  done
                
                # Fallback: Download libc++_shared.so if not found in NDK
                if [ "$FOUND_ANY_LIBC" = false ]; then
                  echo "⚠️  libc++_shared.so not found in NDK, attempting fallback download..."
                  
                  # Create temporary directory for fallback download
                  FALLBACK_DIR="$CM_BUILD_DIR/temp-libc-fallback"
                  mkdir -p "$FALLBACK_DIR"
                  cd "$FALLBACK_DIR"
                  
                  # Download a known working version of libc++_shared.so for ARM architectures
                  # Using a reliable source that provides the necessary libraries
                  LIBC_DOWNLOAD_URL="https://github.com/android/ndk/raw/main/sources/cxx-stl/llvm-libc++/libs"
                  
                  for arch_dir in "$ANDROID_PROJECT_DIR/opencv/src/main/jniLibs"/*; do
                    if [ -d "$arch_dir" ]; then
                      arch_name=$(basename "$arch_dir")
                      
                      # Only download for ARM architectures (most common for Android devices)
                      case "$arch_name" in
                        "arm64-v8a"|"armeabi-v7a")
                          echo "Attempting fallback download for $arch_name..."
                          
                          # Try to download from GitHub NDK repository
                          if curl -L -f -o "libc++_shared_${arch_name}.so" "${LIBC_DOWNLOAD_URL}/${arch_name}/libc++_shared.so" 2>/dev/null; then
                            if file "libc++_shared_${arch_name}.so" | grep -q "ELF.*shared object"; then
                              cp "libc++_shared_${arch_name}.so" "$arch_dir/libc++_shared.so"
                              echo "✅ Fallback download successful for $arch_name"
                              FOUND_ANY_LIBC=true
                            else
                              echo "❌ Downloaded file is not valid ELF binary for $arch_name"
                            fi
                          else
                            echo "⚠️  Fallback download failed for $arch_name"
                          fi
                          ;;
                        *)
                          echo "Skipping fallback download for $arch_name (not ARM)"
                          ;;
                      esac
                    fi
                  done
                  
                  # Clean up fallback directory
                  cd "$ANDROID_PROJECT_DIR"
                  rm -rf "$FALLBACK_DIR"
                  
                  if [ "$FOUND_ANY_LIBC" = false ]; then
                    echo "❌ All fallback methods failed. No stub libraries will be created."
                    echo "The app will need to work without libc++_shared.so or use system libraries."
                  fi
                fi
                
                # Move ALL OpenCV libraries to app module (to avoid duplicates)
                echo "=== MOVING ALL OPENCV LIBRARIES TO APP MODULE ==="
                echo "Moving ALL OpenCV libraries to app module to avoid duplicate resource errors..."
                mkdir -p app/src/main/jniLibs
                
                # Move (not copy) all libraries from OpenCV module to app module
                CRITICAL_LIBS_FOUND=0
                TOTAL_MOVED=0
                
                for arch_dir in opencv/src/main/jniLibs/*/; do
                  if [ -d "$arch_dir" ]; then
                    arch_name=$(basename "$arch_dir")
                    mkdir -p "app/src/main/jniLibs/$arch_name"
                    
                    echo "Processing $arch_name architecture..."
                    
                    # Move all .so files for this architecture
                    for lib_file in "$arch_dir"/*.so; do
                      if [ -f "$lib_file" ]; then
                        lib_name=$(basename "$lib_file")
                        
                        # Move (not copy) to avoid duplicates
                        mv "$lib_file" "app/src/main/jniLibs/$arch_name/"
                        chmod 644 "app/src/main/jniLibs/$arch_name/$lib_name"
                        TOTAL_MOVED=$((TOTAL_MOVED + 1))
                        
                        # Verify the moved file
                        if [ -f "app/src/main/jniLibs/$arch_name/$lib_name" ]; then
                          file_size=$(stat -c%s "app/src/main/jniLibs/$arch_name/$lib_name" 2>/dev/null || stat -f%z "app/src/main/jniLibs/$arch_name/$lib_name" 2>/dev/null || echo "unknown")
                          file_type=$(file "app/src/main/jniLibs/$arch_name/$lib_name" | cut -d: -f2)
                          
                          echo "  ✅ Moved $lib_name ($file_size bytes) - $file_type"
                          
                          # Count critical libraries for ARM architectures
                          if [[ "$arch_name" == "arm64-v8a" || "$arch_name" == "armeabi-v7a" ]]; then
                            if [[ "$lib_name" == "libopencv_java4.so" || "$lib_name" == "libc++_shared.so" ]]; then
                              CRITICAL_LIBS_FOUND=$((CRITICAL_LIBS_FOUND + 1))
                              echo "    🎯 Critical library for ARM devices: $lib_name"
                            fi
                          fi
                        else
                          echo "  ❌ Move verification failed for $lib_name"
                          exit 1
                        fi
                      fi
                    done
                  fi
                done
                
                echo "Total libraries moved to app module: $TOTAL_MOVED"
                
                # Clean up empty directories in OpenCV module to prevent Gradle from including them
                echo "Cleaning up empty directories in OpenCV module..."
                find opencv/src/main/jniLibs -type d -empty -delete 2>/dev/null || true
                
                # Ensure OpenCV build.gradle doesn't include jniLibs to prevent duplicates
                echo "Configuring OpenCV build.gradle to exclude native libraries..."
                if grep -q "jniLibs.srcDirs" opencv/build.gradle; then
                  sed -i.bak 's/jniLibs.srcDirs = \[.*\]/\/\/ jniLibs.srcDirs commented out to prevent duplicate resources/' opencv/build.gradle
                  echo "✅ OpenCV build.gradle configured to exclude jniLibs"
                fi
                
                # Verify OpenCV jniLibs is now empty or minimal
                REMAINING_OPENCV_LIBS=$(find opencv/src/main/jniLibs -name "*.so" 2>/dev/null | wc -l)
                echo "Remaining libraries in OpenCV module: $REMAINING_OPENCV_LIBS (should be 0)"
                
                if [ "$REMAINING_OPENCV_LIBS" -gt 0 ]; then
                  echo "⚠️  Some libraries still remain in OpenCV module - removing them..."
                  find opencv/src/main/jniLibs -name "*.so" -delete 2>/dev/null || true
                  echo "✅ Remaining libraries removed from OpenCV module"
                fi
                
                # Final verification - ensure no .so files in OpenCV module
                FINAL_OPENCV_LIBS=$(find opencv/src/main/jniLibs -name "*.so" 2>/dev/null | wc -l)
                if [ "$FINAL_OPENCV_LIBS" -eq 0 ]; then
                  echo "✅ OpenCV module is now clean of native libraries - no duplicates will occur"
                else
                  echo "❌ Failed to clean OpenCV module of native libraries"
                  exit 1
                fi
                
                # Always attempt to ensure libc++_shared.so is available
                echo "=== ENSURING LIBC++_SHARED.SO AVAILABILITY ==="
                echo "Current status: FOUND_ANY_LIBC=$FOUND_ANY_LIBC"
                
                # Check what we currently have
                for arch_name in "arm64-v8a" "armeabi-v7a"; do
                  if [ -d "opencv/src/main/jniLibs/$arch_name" ]; then
                    if [ -f "opencv/src/main/jniLibs/$arch_name/libc++_shared.so" ]; then
                      libc_size=$(stat -c%s "opencv/src/main/jniLibs/$arch_name/libc++_shared.so" 2>/dev/null || stat -f%z "opencv/src/main/jniLibs/$arch_name/libc++_shared.so" 2>/dev/null || echo "0")
                      echo "Found libc++_shared.so for $arch_name: $libc_size bytes"
                      if [ "$libc_size" -gt 1000 ]; then
                        echo "✅ Valid libc++_shared.so already exists for $arch_name"
                      else
                        echo "❌ Invalid libc++_shared.so for $arch_name (too small: $libc_size bytes)"
                        FOUND_ANY_LIBC=false
                      fi
                    else
                      echo "❌ No libc++_shared.so found for $arch_name"
                      FOUND_ANY_LIBC=false
                    fi
                  fi
                done
                
                # Force download if we don't have valid libraries
                if [ "$FOUND_ANY_LIBC" = false ]; then
                  echo "⚠️  libc++_shared.so was not found in NDK, downloading from reliable source..."
                  
                  # Download pre-built libc++_shared.so files from a reliable source
                  TEMP_LIBC_DIR="$CM_BUILD_DIR/temp-libc-download"
                  mkdir -p "$TEMP_LIBC_DIR"
                  cd "$TEMP_LIBC_DIR"
                  
                  # Use a smaller, more reliable source for just the libraries we need
                  for arch_name in "arm64-v8a" "armeabi-v7a"; do
                    if [ -d "$ANDROID_PROJECT_DIR/app/src/main/jniLibs/$arch_name" ]; then
                      if [ ! -f "$ANDROID_PROJECT_DIR/app/src/main/jniLibs/$arch_name/libc++_shared.so" ]; then
                        echo "Downloading libc++_shared.so for $arch_name..."
                        
                        DOWNLOAD_SUCCESS=false
                        
                        # Try to download from GitHub releases that contain pre-built libraries
                        case "$arch_name" in
                          "arm64-v8a")
                            # Try multiple sources for ARM64
                            DOWNLOAD_URLS=(
                              "https://github.com/android/ndk/raw/main/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so"
                              "https://raw.githubusercontent.com/android/ndk/main/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so"
                            )
                            ;;
                          "armeabi-v7a")
                            # Try multiple sources for ARMv7
                            DOWNLOAD_URLS=(
                              "https://github.com/android/ndk/raw/main/sources/cxx-stl/llvm-libc++/libs/armeabi-v7a/libc++_shared.so"
                              "https://raw.githubusercontent.com/android/ndk/main/sources/cxx-stl/llvm-libc++/libs/armeabi-v7a/libc++_shared.so"
                            )
                            ;;
                        esac
                        
                        # Try each download URL
                        for url in "${DOWNLOAD_URLS[@]}"; do
                          echo "  Trying: $url"
                          if curl -L -f -o "libc++_shared_${arch_name}.so" "$url" 2>/dev/null; then
                            # Verify it's a valid ELF file and reasonable size
                            if [ -f "libc++_shared_${arch_name}.so" ] && [ -s "libc++_shared_${arch_name}.so" ]; then
                              file_size=$(stat -c%s "libc++_shared_${arch_name}.so" 2>/dev/null || stat -f%z "libc++_shared_${arch_name}.so" 2>/dev/null || echo "0")
                              
                              # Check if file is reasonable size (should be > 100KB for a real library)
                              if [ "$file_size" -gt 100000 ]; then
                                if file "libc++_shared_${arch_name}.so" | grep -q "ELF.*shared object"; then
                                  cp "libc++_shared_${arch_name}.so" "$ANDROID_PROJECT_DIR/app/src/main/jniLibs/$arch_name/libc++_shared.so"
                                  chmod 644 "$ANDROID_PROJECT_DIR/app/src/main/jniLibs/$arch_name/libc++_shared.so"
                                  
                                  echo "✅ Successfully downloaded real libc++_shared.so for $arch_name ($file_size bytes)"
                                  DOWNLOAD_SUCCESS=true
                                  CRITICAL_LIBS_FOUND=$((CRITICAL_LIBS_FOUND + 1))
                                  break
                                else
                                  echo "  ❌ Downloaded file is not a valid ELF binary"
                                fi
                              else
                                echo "  ❌ Downloaded file too small ($file_size bytes) - likely not a real library"
                              fi
                            else
                              echo "  ❌ Downloaded file is empty or doesn't exist"
                            fi
                          else
                            echo "  ❌ Download failed from $url"
                          fi
                        done
                        
                        # If direct download failed, try alternative approach
                        if [ "$DOWNLOAD_SUCCESS" = false ]; then
                          echo "Direct download failed, trying alternative approach..."
                          
                          # Alternative: Use the system's libc++ if available and compatible
                          case "$arch_name" in
                            "arm64-v8a")
                              # Look for system ARM64 libraries
                              if [ -f "/usr/lib/aarch64-linux-gnu/libc++.so.1" ]; then
                                echo "Using system ARM64 libc++ library"
                                cp "/usr/lib/aarch64-linux-gnu/libc++.so.1" "$ANDROID_PROJECT_DIR/app/src/main/jniLibs/$arch_name/libc++_shared.so"
                                chmod 644 "$ANDROID_PROJECT_DIR/app/src/main/jniLibs/$arch_name/libc++_shared.so"
                                DOWNLOAD_SUCCESS=true
                                CRITICAL_LIBS_FOUND=$((CRITICAL_LIBS_FOUND + 1))
                              fi
                              ;;
                            "armeabi-v7a")
                              # For ARMv7, we might need to skip if no compatible library is available
                              echo "No compatible system library found for ARMv7"
                              ;;
                          esac
                        fi
                        
                        # Final status for this architecture
                        if [ "$DOWNLOAD_SUCCESS" = false ]; then
                          echo "❌ Failed to obtain libc++_shared.so for $arch_name"
                          echo "OpenCV may not work on $arch_name devices"
                        fi
                      else
                        echo "✅ libc++_shared.so already exists for $arch_name"
                        CRITICAL_LIBS_FOUND=$((CRITICAL_LIBS_FOUND + 1))
                      fi
                    fi
                  done
                  
                  # Clean up download directory
                  cd "$ANDROID_PROJECT_DIR"
                  rm -rf "$TEMP_LIBC_DIR"
                  
                  # Update FOUND_ANY_LIBC based on successful downloads
                  if [ "$CRITICAL_LIBS_FOUND" -gt 0 ]; then
                    FOUND_ANY_LIBC=true
                    echo "✅ Successfully obtained libc++_shared.so through alternative download"
                  fi
                fi
                
                # Verify critical libraries exist and are valid for ARM architectures
                for arch_name in "arm64-v8a" "armeabi-v7a"; do
                  if [ -d "app/src/main/jniLibs/$arch_name" ]; then
                    echo "Verifying critical libraries for $arch_name..."
                    
                    # Check libopencv_java4.so
                    if [ ! -f "app/src/main/jniLibs/$arch_name/libopencv_java4.so" ]; then
                      echo "❌ Critical library missing: libopencv_java4.so for $arch_name"
                      exit 1
                    else
                      opencv_size=$(stat -c%s "app/src/main/jniLibs/$arch_name/libopencv_java4.so" 2>/dev/null || stat -f%z "app/src/main/jniLibs/$arch_name/libopencv_java4.so" 2>/dev/null || echo "0")
                      echo "  ✅ libopencv_java4.so present ($opencv_size bytes)"
                    fi
                    
                    # Check libc++_shared.so with size validation
                    if [ ! -f "app/src/main/jniLibs/$arch_name/libc++_shared.so" ]; then
                      echo "❌ Critical library missing: libc++_shared.so for $arch_name"
                      exit 1
                    else
                      libc_size=$(stat -c%s "app/src/main/jniLibs/$arch_name/libc++_shared.so" 2>/dev/null || stat -f%z "app/src/main/jniLibs/$arch_name/libc++_shared.so" 2>/dev/null || echo "0")
                      echo "  📏 libc++_shared.so size: $libc_size bytes"
                      
                      # Validate that it's not a tiny stub file
                      if [ "$libc_size" -lt 1000 ]; then
                        echo "  ❌ libc++_shared.so is too small ($libc_size bytes) - likely an invalid stub"
                        echo "  This will cause the runtime error: 'is too small to be an ELF executable'"
                        
                        # Remove the invalid file
                        rm -f "app/src/main/jniLibs/$arch_name/libc++_shared.so"
                        echo "  🗑️  Removed invalid stub file"
                        
                        # Don't exit - let the app try to work without it
                        echo "  ⚠️  App will attempt to run without libc++_shared.so for $arch_name"
                      else
                        # Verify it's a valid ELF file
                        if file "app/src/main/jniLibs/$arch_name/libc++_shared.so" | grep -q "ELF.*shared object"; then
                          echo "  ✅ libc++_shared.so is valid ELF binary ($libc_size bytes)"
                        else
                          echo "  ⚠️  libc++_shared.so may not be a valid ELF binary"
                        fi
                      fi
                    fi
                    
                    echo "✅ Library verification completed for $arch_name"
                  fi
                done
                
                # Final validation for ARM device support
                if [ "$CRITICAL_LIBS_FOUND" -lt 2 ]; then
                  echo "❌ Insufficient critical libraries found for ARM devices (found: $CRITICAL_LIBS_FOUND, expected: at least 2)"
                  echo "This will cause runtime failures on ARM Android devices"
                  
                  # Show what we actually have
                  echo "Libraries actually found in app module:"
                  find app/src/main/jniLibs -name "*.so" | head -10
                  exit 1
                else
                  echo "✅ Critical ARM libraries validation passed ($CRITICAL_LIBS_FOUND critical libraries found)"
                fi
                
                # Verify app module has the libraries
                APP_LIBC_COUNT=$(find app/src/main/jniLibs -name "libc++_shared.so" 2>/dev/null | wc -l)
                APP_OPENCV_COUNT=$(find app/src/main/jniLibs -name "libopencv_java4.so" 2>/dev/null | wc -l)
                echo "Libraries in app module:"
                echo "  libc++_shared.so files: $APP_LIBC_COUNT"
                echo "  libopencv_java4.so files: $APP_OPENCV_COUNT"
                
                if [ "$FOUND_ANY_LIBC" = true ]; then
                  echo "✅ Successfully added libc++_shared.so from NDK to OpenCV module"
                else
                  echo "⚠️  Used stub libc++_shared.so (NDK version not found)"
                  echo "App may need real NDK library for full functionality"
                fi
                
                # Show library distribution by architecture
                echo "Library distribution by architecture:"
                echo "✅ Library distribution completed successfully"
              else
                echo "❌ No OpenCV native libraries found"
                exit 1
              fi
            else
              echo "❌ OpenCV native libraries directory not found"
              exit 1
            fi
          else
            echo "❌ OpenCV module directory not found"
            exit 1
          fi

          # Verify OpenCV is included in settings.gradle
          if grep -q ":opencv" settings.gradle; then
            echo "✅ OpenCV module included in settings.gradle"
          else
            echo "❌ OpenCV module not included in settings.gradle"
            exit 1
          fi

          # Check app module dependency on OpenCV
          if grep -q "implementation project(':opencv')" app/build.gradle; then
            echo "✅ App module depends on OpenCV"
          else
            echo "❌ App module does not depend on OpenCV"
            exit 1
          fi

          # Test OpenCV classes compilation
          echo "Testing OpenCV classes availability..."
          if find opencv/src/main/java -name "Mat.java" | grep -q .; then
            echo "✅ OpenCV Mat class found"
          else
            echo "❌ OpenCV Mat class not found"
            exit 1
          fi

          if find opencv/src/main/java -name "Utils.java" | grep -q .; then
            echo "✅ OpenCV Utils class found"
          else
            echo "❌ OpenCV Utils class not found"
            exit 1
          fi

          echo "✅ OpenCV integration validation completed successfully"  
    
      - name: Pre-build library verification
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== PRE-BUILD LIBRARY VERIFICATION ==="
          
          # Debug: Show directory structure
          echo "Directory structure check:"
          echo "OpenCV module exists: $([ -d "opencv" ] && echo "YES" || echo "NO")"
          echo "OpenCV jniLibs exists: $([ -d "opencv/src/main/jniLibs" ] && echo "YES" || echo "NO")"
          echo "App module exists: $([ -d "app" ] && echo "YES" || echo "NO")"
          echo "App jniLibs exists: $([ -d "app/src/main/jniLibs" ] && echo "YES" || echo "NO")"
          
          # Verify libraries in OpenCV module (should be empty after move)
          echo ""
          echo "OpenCV module libraries (should be empty after move to app module):"
          if [ -d "opencv/src/main/jniLibs" ]; then
            OPENCV_LIB_COUNT=$(find opencv/src/main/jniLibs -name "*.so" | wc -l)
            echo "  Total .so files found: $OPENCV_LIB_COUNT (should be 0)"
            
            if [ "$OPENCV_LIB_COUNT" -gt 0 ]; then
              echo "  ⚠️  Libraries still present in OpenCV module (may cause duplicates):"
              find opencv/src/main/jniLibs -name "*.so" | while read lib; do
                arch=$(basename "$(dirname "$lib")")
                libname=$(basename "$lib")
                file_info=$(file "$lib" | cut -d: -f2)
                echo "    $arch/$libname: $file_info"
              done
            else
              echo "  ✅ No .so files in OpenCV module (good - prevents duplicates)"
            fi
          else
            echo "  ✅ No jniLibs directory in OpenCV module (good - prevents duplicates)"
          fi
          
          # Verify libraries in app module
          echo ""
          echo "App module libraries:"
          if [ -d "app/src/main/jniLibs" ]; then
            APP_LIB_COUNT=$(find app/src/main/jniLibs -name "*.so" | wc -l)
            echo "  Total .so files found: $APP_LIB_COUNT"
            
            if [ "$APP_LIB_COUNT" -gt 0 ]; then
              find app/src/main/jniLibs -name "*.so" | while read lib; do
                arch=$(basename "$(dirname "$lib")")
                libname=$(basename "$lib")
                file_info=$(file "$lib" | cut -d: -f2)
                echo "  $arch/$libname: $file_info"
              done
            else
              echo "  No .so files found in app module"
              echo "  Available directories:"
              find app/src/main/jniLibs -type d 2>/dev/null | head -10 || echo "    None"
            fi
          else
            echo "  No jniLibs directory in app module"
            echo "  This means library copying failed - checking why..."
            
            # If app jniLibs doesn't exist but OpenCV has libraries, copying failed
            if [ -d "opencv/src/main/jniLibs" ] && [ "$(find opencv/src/main/jniLibs -name "*.so" | wc -l)" -gt 0 ]; then
              echo "  ❌ OpenCV has libraries but they weren't copied to app module"
              echo "  This indicates the library copying step in 'Validate OpenCV integration' failed"
              echo "  Attempting manual copy now..."
              
              mkdir -p app/src/main/jniLibs
              cp -r opencv/src/main/jniLibs/* app/src/main/jniLibs/
              
              echo "  Manual copy completed. Verifying..."
              if [ -d "app/src/main/jniLibs" ]; then
                MANUAL_COPY_COUNT=$(find app/src/main/jniLibs -name "*.so" | wc -l)
                echo "  ✅ Manual copy successful: $MANUAL_COPY_COUNT libraries copied"
              else
                echo "  ❌ Manual copy failed"
                exit 1
              fi
            fi
          fi
          
          # Count total libraries and validate ARM support
          TOTAL_OPENCV_LIBS=$(find opencv/src/main/jniLibs -name "*.so" 2>/dev/null | wc -l)
          TOTAL_APP_LIBS=$(find app/src/main/jniLibs -name "*.so" 2>/dev/null | wc -l)
          ARM64_LIBS=$(find app/src/main/jniLibs/arm64-v8a -name "*.so" 2>/dev/null | wc -l)
          ARMV7_LIBS=$(find app/src/main/jniLibs/armeabi-v7a -name "*.so" 2>/dev/null | wc -l)
          
          echo "Library distribution summary:"
          echo "  OpenCV module: $TOTAL_OPENCV_LIBS libraries (should be 0 to prevent duplicates)"
          echo "  App module: $TOTAL_APP_LIBS libraries (should contain all libraries)"
          echo "  ARM64-v8a: $ARM64_LIBS libraries"
          echo "  ARMv7a: $ARMV7_LIBS libraries"
          
          # Warn if OpenCV module still has libraries
          if [ "$TOTAL_OPENCV_LIBS" -gt 0 ]; then
            echo "⚠️  WARNING: OpenCV module still contains $TOTAL_OPENCV_LIBS libraries"
            echo "This may cause duplicate resource errors during build"
          fi
          
          # Validate minimum requirements for ARM devices (more flexible check)
          if [ "$ARM64_LIBS" -eq 0 ] && [ "$ARMV7_LIBS" -eq 0 ]; then
            echo "❌ No ARM libraries found - app will fail on ARM Android devices"
            echo "This indicates the library copying step failed completely"
            exit 1
          elif [ "$ARM64_LIBS" -lt 2 ] && [ "$ARMV7_LIBS" -lt 2 ]; then
            echo "⚠️  Limited ARM libraries found - checking if critical ones are present..."
            
            # Check for at least one critical library per architecture
            ARM64_OPENCV=$(find app/src/main/jniLibs/arm64-v8a -name "libopencv_java4.so" 2>/dev/null | wc -l)
            ARM64_LIBC=$(find app/src/main/jniLibs/arm64-v8a -name "libc++_shared.so" 2>/dev/null | wc -l)
            ARMV7_OPENCV=$(find app/src/main/jniLibs/armeabi-v7a -name "libopencv_java4.so" 2>/dev/null | wc -l)
            ARMV7_LIBC=$(find app/src/main/jniLibs/armeabi-v7a -name "libc++_shared.so" 2>/dev/null | wc -l)
            
            echo "Critical library check:"
            echo "  ARM64 libopencv_java4.so: $ARM64_OPENCV"
            echo "  ARM64 libc++_shared.so: $ARM64_LIBC"
            echo "  ARMv7 libopencv_java4.so: $ARMV7_OPENCV"
            echo "  ARMv7 libc++_shared.so: $ARMV7_LIBC"
            
            # At least one architecture should have both critical libraries
            if [[ ($ARM64_OPENCV -gt 0 && $ARM64_LIBC -gt 0) || ($ARMV7_OPENCV -gt 0 && $ARMV7_LIBC -gt 0) ]]; then
              echo "✅ At least one ARM architecture has critical libraries - proceeding"
            else
              echo "❌ No ARM architecture has both critical libraries - app will fail"
              exit 1
            fi
          else
            echo "✅ Sufficient ARM libraries found"
          fi
          
          # Show specific ARM libraries for verification
          echo ""
          echo "ARM64-v8a libraries (for modern ARM devices):"
          find app/src/main/jniLibs/arm64-v8a -name "*.so" 2>/dev/null | while read lib; do
            lib_name=$(basename "$lib")
            file_size=$(stat -c%s "$lib" 2>/dev/null || stat -f%z "$lib" 2>/dev/null || echo "unknown")
            echo "  $lib_name ($file_size bytes)"
          done
          
          echo ""
          echo "ARMv7a libraries (for older ARM devices):"
          find app/src/main/jniLibs/armeabi-v7a -name "*.so" 2>/dev/null | while read lib; do
            lib_name=$(basename "$lib")
            file_size=$(stat -c%s "$lib" 2>/dev/null || stat -f%z "$lib" 2>/dev/null || echo "unknown")
            echo "  $lib_name ($file_size bytes)"
          done
          
          echo "Total libraries - OpenCV module: $OPENCV_LIBS, App module: $APP_LIBS"
          
          # Verify libc++_shared.so specifically
          OPENCV_LIBC=$(find opencv/src/main/jniLibs -name "libc++_shared.so" 2>/dev/null | wc -l)
          APP_LIBC=$(find app/src/main/jniLibs -name "libc++_shared.so" 2>/dev/null | wc -l)
          
          echo "libc++_shared.so - OpenCV module: $OPENCV_LIBC, App module: $APP_LIBC"
          
          if [ "$APP_LIBC" -eq 0 ]; then
            echo "⚠️  libc++_shared.so not found in app module - may not be included in APK"
          else
            echo "✅ libc++_shared.so found in app module - should be included in APK"
          fi
          
          # Force a clean to ensure libraries are properly included
          echo "Performing clean build to ensure library inclusion..."
          $GRADLE_EXECUTABLE clean
          
          # Verify libraries exist before building
          echo "Final verification before build:"
          echo "OpenCV module libraries:"
          find opencv/src/main/jniLibs -name "*.so" 2>/dev/null | head -10
          echo "App module libraries:"
          find app/src/main/jniLibs -name "*.so" 2>/dev/null | head -10
      
      - name: Verify OpenCV libraries in APK
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== VERIFYING OPENCV LIBRARIES IN APK ==="
          
          # Build a test APK first to verify library inclusion
          echo "Building test APK to verify OpenCV library inclusion..."
          if ! $GRADLE_EXECUTABLE assembleDebug --stacktrace; then
            echo "❌ Failed to build test APK for verification"
            exit 1
          fi
          
          # Find the built APK
          APK_PATH=$(find . -name "app-debug.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Could not find built APK for verification"
            exit 1
          fi
          
          echo "✅ Found APK: $APK_PATH"
          
          # Extract APK to verify contents
          TEMP_APK_DIR="temp-apk-verification"
          mkdir -p "$TEMP_APK_DIR"
          
          # Use unzip to extract APK contents
          if unzip -q "$APK_PATH" -d "$TEMP_APK_DIR"; then
            echo "✅ APK extracted for verification"
            
            # Check for OpenCV native libraries in APK
            echo "Checking for OpenCV libraries in APK..."
            OPENCV_LIBS_IN_APK=$(find "$TEMP_APK_DIR" -name "libopencv_java4.so" | wc -l)
            LIBC_SHARED_IN_APK=$(find "$TEMP_APK_DIR" -name "libc++_shared.so" | wc -l)
            
            echo "OpenCV libraries found in APK: $OPENCV_LIBS_IN_APK"
            echo "libc++_shared.so found in APK: $LIBC_SHARED_IN_APK"
            
            if [ "$OPENCV_LIBS_IN_APK" -gt 0 ]; then
              echo "✅ OpenCV core libraries are included in APK"
              
              if [ "$LIBC_SHARED_IN_APK" -gt 0 ]; then
                echo "✅ libc++_shared.so is included in APK (required by OpenCV)"
                
                # Validate that the included libc++_shared.so files are valid ELF binaries
                echo "Validating libc++_shared.so files in APK..."
                find "$TEMP_APK_DIR" -name "libc++_shared.so" | while read lib_file; do
                  if file "$lib_file" | grep -q "ELF.*shared object"; then
                    echo "✅ Valid ELF binary: $(echo "$lib_file" | sed "s|$TEMP_APK_DIR/||")"
                  else
                    echo "❌ Invalid binary: $(echo "$lib_file" | sed "s|$TEMP_APK_DIR/||")"
                  fi
                done
              else
                echo "⚠️  libc++_shared.so missing from APK"
                echo "Investigating why libraries didn't make it to APK..."
                
                # Check if libraries exist in opencv module
                if find opencv/src/main/jniLibs -name "libc++_shared.so" | grep -q .; then
                  echo "✅ libc++_shared.so found in opencv module"
                  find opencv/src/main/jniLibs -name "libc++_shared.so" | while read lib; do
                    arch=$(basename "$(dirname "$lib")")
                    echo "  - $arch: $(file "$lib")"
                  done
                else
                  echo "❌ libc++_shared.so not found in opencv module"
                fi
                
                # Check if libraries exist in app module
                if find app/src/main/jniLibs -name "libc++_shared.so" 2>/dev/null | grep -q .; then
                  echo "✅ libc++_shared.so found in app module"
                else
                  echo "❌ libc++_shared.so not found in app module"
                fi
                
                # Show what libraries are actually in the APK
                echo "Libraries actually in APK:"
                find "$TEMP_APK_DIR" -name "*.so" | head -10 | while read lib; do
                  echo "  $(echo "$lib" | sed "s|$TEMP_APK_DIR/||")"
                done
                
                echo "⚠️  Continuing build - OpenCV may use system libc++_shared.so"
              fi
              
              # Show library distribution in APK
              echo "Library distribution in APK:"
              find "$TEMP_APK_DIR" -name "*.so" | while read lib; do
                lib_path=$(echo "$lib" | sed "s|$TEMP_APK_DIR/||")
                echo "  $lib_path"
              done | head -10
            else
              echo "❌ OpenCV core libraries missing from APK"
              echo "APK lib directory contents:"
              find "$TEMP_APK_DIR" -path "*/lib/*" -type f | head -10
              exit 1
            fi
            
            # Clean up
            rm -rf "$TEMP_APK_DIR"
          else
            echo "❌ Failed to extract APK for verification"
            exit 1
          fi
          
          echo "✅ OpenCV library verification in APK completed successfully"
      
      - name: Build debug APK with Android 10 validation
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== ANDROID 10 COMPATIBILITY PRE-BUILD VALIDATION ==="
          
          # Validate target SDK
          if grep -q "targetSdk 29" app/build.gradle; then
            echo "✅ Target SDK 29 (Android 10) confirmed"
          else
            echo "❌ Target SDK should be 29 for Android 10 compatibility"
            grep "targetSdk" app/build.gradle || echo "Target SDK not found"
            exit 1
          fi
          
          # Validate required permissions for Android 10
          echo "Checking Android 10 permission compliance..."
          if grep -q "android.permission.CAMERA" app/src/main/AndroidManifest.xml; then
            echo "✅ Camera permission declared"
          else
            echo "❌ Camera permission not found in AndroidManifest.xml"
            exit 1
          fi
          
          # Check for Android 10 privacy compliance features
          if grep -q "android:requestLegacyExternalStorage" app/src/main/AndroidManifest.xml; then
            echo "⚠️  Legacy external storage flag found - ensure scoped storage compliance"
          fi
          
          echo "=== BUILDING DEBUG APK WITH JAVA 17 ==="
          echo "Build environment:"
          echo "  Java: $(java -version 2>&1 | head -1)"
          echo "  Gradle: $($GRADLE_EXECUTABLE --version | head -1)"
          echo "  Android Gradle Plugin: $(grep 'com.android.application' build.gradle)"
          
          # Build with comprehensive error handling and library verification
          echo "Building APK with library inclusion verification..."
          if ! $GRADLE_EXECUTABLE assembleDebug --stacktrace --info; then
            echo "❌ Debug APK build failed"
            echo "=== BUILD FAILURE ANALYSIS ==="
            
            # Check for common build issues
            echo "Checking for common build issues..."
            
            # Java version compatibility
            echo "Java version compatibility check:"
            java -version 2>&1 | grep -q "17\." && echo "✅ Java 17 confirmed" || echo "❌ Java 17 not detected"
            
            # Gradle version compatibility
            echo "Gradle version compatibility check:"
            $GRADLE_EXECUTABLE --version | grep -q "8\." && echo "✅ Gradle 8.x confirmed" || echo "❌ Gradle 8.x not detected"
            
            # Memory issues
            echo "Memory status:"
            free -h 2>/dev/null || vm_stat | head -5
            
            exit 1
          else
            echo "✅ Debug APK built successfully with Java 17 and Android 10 compatibility"
            
            # Verify APK was created and contains ARM libraries
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
              APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || echo "unknown")
              echo "✅ APK file created: $APK_PATH ($APK_SIZE bytes)"
              
              # Critical verification: Check if APK contains ARM libraries to fix runtime error
              echo "=== CRITICAL APK VERIFICATION FOR ARM DEVICES ==="
              
              if command -v unzip >/dev/null 2>&1; then
                echo "Verifying APK contains libraries to fix 'libc++_shared.so not found' error..."
                
                # Check for the specific libraries that were missing in the logcat
                ARM64_OPENCV=$(unzip -l "$APK_PATH" | grep -c "lib/arm64-v8a/libopencv_java4.so" || echo "0")
                ARM64_LIBC=$(unzip -l "$APK_PATH" | grep -c "lib/arm64-v8a/libc++_shared.so" || echo "0")
                ARMV7_OPENCV=$(unzip -l "$APK_PATH" | grep -c "lib/armeabi-v7a/libopencv_java4.so" || echo "0")
                ARMV7_LIBC=$(unzip -l "$APK_PATH" | grep -c "lib/armeabi-v7a/libc++_shared.so" || echo "0")
                
                echo "Library verification results:"
                echo "  ARM64 libopencv_java4.so: $([[ $ARM64_OPENCV -gt 0 ]] && echo "✅ FOUND" || echo "❌ MISSING")"
                echo "  ARM64 libc++_shared.so: $([[ $ARM64_LIBC -gt 0 ]] && echo "✅ FOUND" || echo "❌ MISSING")"
                echo "  ARMv7 libopencv_java4.so: $([[ $ARMV7_OPENCV -gt 0 ]] && echo "✅ FOUND" || echo "⚠️  MISSING")"
                echo "  ARMv7 libc++_shared.so: $([[ $ARMV7_LIBC -gt 0 ]] && echo "✅ FOUND" || echo "⚠️  MISSING")"
                
                # The critical check: ARM64 libraries (most modern Android devices)
                if [[ $ARM64_OPENCV -gt 0 && $ARM64_LIBC -gt 0 ]]; then
                  echo "🎯 SUCCESS: APK contains critical ARM64 libraries - runtime error should be FIXED!"
                  echo "The 'libc++_shared.so not found' error from the logcat should no longer occur."
                else
                  echo "❌ CRITICAL FAILURE: APK missing ARM64 libraries - runtime error will persist"
                  echo "Missing libraries will cause the same error: 'dlopen failed: library \"libc++_shared.so\" not found'"
                  
                  # Show what's actually in the APK for debugging
                  echo "Libraries actually found in APK:"
                  unzip -l "$APK_PATH" | grep "lib/.*\.so$" | head -10
                  exit 1
                fi
                
                # Show all ARM libraries for verification
                echo ""
                echo "All ARM libraries in APK (should include the missing ones from logcat):"
                unzip -l "$APK_PATH" | grep "lib/arm.*\.so$" | awk '{print "  " $4}' | sort
              else
                echo "⚠️  Cannot verify APK library contents (unzip not available)"
              fi
            else
              echo "❌ APK file not found at expected location"
              find app/build/outputs -name "*.apk" | head -5
              exit 1
            fi
          fi
      
      - name: Execute comprehensive unit tests
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== COMPREHENSIVE UNIT TEST EXECUTION ==="
          
          # First try to compile to get detailed error information
          echo "Attempting compilation to identify specific errors..."
          if ! $GRADLE_EXECUTABLE compileDebugJavaWithJavac --stacktrace --info; then
            echo "❌ Compilation failed - checking for detailed error information"
            
            # Check if OpenCV stubs are properly created
            echo "=== OPENCV STUB VERIFICATION ==="
            if [ -d "opencv/src/main/java" ]; then
              find opencv/src/main/java -name "*.java" -exec echo "Found: {}" \; -exec head -3 {} \;
            else
              echo "❌ OpenCV stub directory not found"
            fi
            
            # Check main source files
            echo "=== MAIN SOURCE FILES ==="
            find app/src/main/java -name "*.java" | head -10
            
            echo "❌ Compilation failed - see errors above"
            exit 1
          fi
          
          echo "✅ Compilation successful, running unit tests with coverage reporting..."
          
          # Run tests with coverage
          if ! $GRADLE_EXECUTABLE testDebugUnitTest jacocoTestReport --stacktrace; then
            echo "❌ Unit tests failed"
            echo "=== TEST FAILURE ANALYSIS ==="
            
            # Show test results if available
            if [ -d "app/build/reports/tests/testDebugUnitTest" ]; then
              echo "Test report location: app/build/reports/tests/testDebugUnitTest"
              if [ -f "app/build/reports/tests/testDebugUnitTest/index.html" ]; then
                echo "HTML test report available"
              fi
            fi
            
            # Show test result XML files
            echo "Test result XML files:"
            find app/build -name "TEST-*.xml" | head -5
            
            exit 1
          else
            echo "✅ Unit tests passed successfully"
            
            # Show test results summary
            if [ -f "app/build/reports/tests/testDebugUnitTest/index.html" ]; then
              echo "✅ HTML test report generated"
            fi
            
            # Show coverage results
            if [ -f "app/build/reports/jacoco/jacocoTestReport/html/index.html" ]; then
              echo "✅ Coverage report generated"
            fi
            
            # Count test results
            TEST_COUNT=$(find app/build -name "TEST-*.xml" -exec grep -l "testcase" {} \; | wc -l)
            echo "Test result files found: $TEST_COUNT"
          fi
      
      - name: Execute Android lint with Android 10 checks
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== ANDROID LINT WITH ANDROID 10 COMPLIANCE CHECKS ==="
          
          # Run lint with detailed reporting
          if ! $GRADLE_EXECUTABLE lintDebug --stacktrace; then
            echo "❌ Android lint found issues"
            echo "=== LINT RESULTS ANALYSIS ==="
            
            # Show lint results if available
            if [ -f "app/build/reports/lint-results-debug.html" ]; then
              echo "✅ HTML lint report available: app/build/reports/lint-results-debug.html"
            fi
            
            if [ -f "app/build/reports/lint-results-debug.xml" ]; then
              echo "✅ XML lint report available: app/build/reports/lint-results-debug.xml"
              
              # Show critical issues
              echo "Critical lint issues:"
              grep -A 2 -B 1 'severity="Error"' app/build/reports/lint-results-debug.xml | head -20 || echo "No critical errors found"
            fi
            
            # Don't fail build on lint warnings, but report them
            echo "⚠️  Lint issues found but continuing build"
          else
            echo "✅ Android lint passed without issues"
          fi
          
          # Specific Android 10 compliance checks
          echo "=== ANDROID 10 SPECIFIC COMPLIANCE VALIDATION ==="
          
          # Check for deprecated API usage
          if [ -f "app/build/reports/lint-results-debug.xml" ]; then
            if grep -q "Deprecated" app/build/reports/lint-results-debug.xml; then
              echo "⚠️  Deprecated API usage detected - review for Android 10 compatibility"
            else
              echo "✅ No deprecated API usage detected"
            fi
            
            # Check for privacy-related issues
            if grep -q "PrivacyLeakage\|LocationApi\|CameraApi" app/build/reports/lint-results-debug.xml; then
              echo "⚠️  Privacy-related lint issues detected - review for Android 10 compliance"
            else
              echo "✅ No privacy-related lint issues detected"
            fi
          fi
      
      - name: Verify build outputs before artifact collection
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== VERIFYING BUILD OUTPUTS EXIST ==="
          
          # Make verification script executable and run it
          if [ -f "scripts/verify-build-outputs.sh" ]; then
            chmod +x scripts/verify-build-outputs.sh
            if ./scripts/verify-build-outputs.sh; then
              echo "✅ Build outputs verification passed"
            else
              echo "❌ Build outputs verification failed"
              echo "Listing all files in build directories:"
              find . -path "*/build/*" -type f | head -20
              exit 1
            fi
          else
            echo "⚠️  Verification script not found, proceeding with manual checks"
            
            # Manual verification
            APK_COUNT=$(find . -name "*.apk" -type f | wc -l)
            if [ "$APK_COUNT" -eq 0 ]; then
              echo "❌ No APK files found!"
              echo "Build directory structure:"
              find . -path "*/build/*" -type d | head -10
              exit 1
            else
              echo "✅ Found $APK_COUNT APK file(s)"
            fi
          fi
          
      - name: Collect comprehensive build artifacts and metadata
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== COMPREHENSIVE ARTIFACT COLLECTION ==="
          
          # Create artifact directories
          mkdir -p build-artifacts/{test-results,lint-results,coverage-reports,apk-outputs,build-metadata}
          
          # Also create root-level artifacts directory for Codemagic
          mkdir -p "$CM_BUILD_DIR/artifacts"
          
          # Collect test results
          echo "Collecting test results..."
          find . -name "TEST-*.xml" -exec cp {} build-artifacts/test-results/ \; 2>/dev/null || echo "No XML test results found"
          find . -path "*/reports/tests/*" -name "*.html" -exec cp {} build-artifacts/test-results/ \; 2>/dev/null || echo "No HTML test results found"
          
          # Collect lint results
          echo "Collecting lint results..."
          find . -name "lint-results*.xml" -exec cp {} build-artifacts/lint-results/ \; 2>/dev/null || echo "No XML lint results found"
          find . -name "lint-results*.html" -exec cp {} build-artifacts/lint-results/ \; 2>/dev/null || echo "No HTML lint results found"
          
          # Collect coverage reports
          echo "Collecting coverage reports..."
          find . -path "*/jacoco*" -name "*.xml" -exec cp {} build-artifacts/coverage-reports/ \; 2>/dev/null || echo "No XML coverage reports found"
          find . -path "*/jacoco*" -name "index.html" -exec cp {} build-artifacts/coverage-reports/ \; 2>/dev/null || echo "No HTML coverage reports found"
          
          # Collect APK outputs
          echo "Collecting APK outputs..."
          find . -name "*.apk" -exec cp {} build-artifacts/apk-outputs/ \; 2>/dev/null || echo "No APK files found"
          find . -name "mapping.txt" -exec cp {} build-artifacts/apk-outputs/ \; 2>/dev/null || echo "No mapping files found"
          
          # Also copy APKs to root artifacts directory for Codemagic
          find . -name "*.apk" -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || echo "No APK files found for root copy"
          
          # Generate comprehensive build metadata
          echo "Generating build metadata..."
          {
            echo "{"
            echo "  \"buildId\": \"$CM_BUILD_ID\","
            echo "  \"buildTimestamp\": \"$BUILD_TIMESTAMP\","
            echo "  \"gitCommit\": \"$CM_COMMIT\","
            echo "  \"gitBranch\": \"$CM_BRANCH\","
            echo "  \"javaVersion\": \"$(java -version 2>&1 | head -1 | sed 's/.*\"\(.*\)\".*/\1/')\","
            echo "  \"gradleVersion\": \"$($GRADLE_EXECUTABLE --version | head -1 | sed 's/Gradle //')\","
            echo "  \"androidGradlePlugin\": \"$(grep 'com.android.application' build.gradle | sed 's/.*version //' | tr -d "'")\","
            echo "  \"targetSdk\": \"$(grep 'targetSdk' app/build.gradle | sed 's/.*targetSdk //' | tr -d ' ')\","
            echo "  \"buildType\": \"development\","
            echo "  \"platform\": \"$(uname -s)\","
            echo "  \"architecture\": \"$(uname -m)\""
            echo "}"
          } > build-artifacts/build-metadata/build-info.json
          
          # Generate detailed build environment info
          {
            echo "=== CODEMAGIC BUILD ENVIRONMENT INFO ==="
            echo "Build ID: $CM_BUILD_ID"
            echo "Build Timestamp: $BUILD_TIMESTAMP"
            echo "Git Commit: $CM_COMMIT"
            echo "Git Branch: $CM_BRANCH"
            echo "Java Version: $(java -version 2>&1)"
            echo "Gradle Version: $($GRADLE_EXECUTABLE --version)"
            echo "Android SDK Root: $ANDROID_SDK_ROOT"
            echo "Platform: $(uname -a)"
            echo "Available Memory: $(free -h 2>/dev/null || vm_stat | head -5)"
            echo "Disk Space: $(df -h . | tail -1)"
          } > build-artifacts/build-metadata/environment-info.txt
          
          # Generate artifact summary
          echo "=== BUILD ARTIFACT SUMMARY ===" > build-artifacts/build-metadata/artifact-summary.txt
          echo "Test Results: $(find build-artifacts/test-results -type f | wc -l) files" >> build-artifacts/build-metadata/artifact-summary.txt
          echo "Lint Results: $(find build-artifacts/lint-results -type f | wc -l) files" >> build-artifacts/build-metadata/artifact-summary.txt
          echo "Coverage Reports: $(find build-artifacts/coverage-reports -type f | wc -l) files" >> build-artifacts/build-metadata/artifact-summary.txt
          echo "APK Outputs: $(find build-artifacts/apk-outputs -type f | wc -l) files" >> build-artifacts/build-metadata/artifact-summary.txt
          
          # Create APK download summary
          echo "=== APK DOWNLOAD INFORMATION ===" >> build-artifacts/build-metadata/artifact-summary.txt
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
            echo "✅ APK Generated Successfully!" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "   File: app-debug.apk" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "   Size: $APK_SIZE" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "   Location: app/build/outputs/apk/debug/app-debug.apk" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "📱 To download your APK:" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "   1. Go to codemagic.io dashboard" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "   2. Open this build (#$CM_BUILD_ID)" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "   3. Click on 'Artifacts' tab" >> build-artifacts/build-metadata/artifact-summary.txt
            echo "   4. Download 'app-debug.apk'" >> build-artifacts/build-metadata/artifact-summary.txt
          else
            echo "❌ APK not found at expected location" >> build-artifacts/build-metadata/artifact-summary.txt
          fi
          
          echo "✅ Artifact collection completed"
          echo "Artifact summary:"
          cat build-artifacts/build-metadata/artifact-summary.txt
          
      - name: Debug artifact paths and fix collection
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          
          echo "=== DEBUGGING ARTIFACT PATHS ==="
          echo "Current directory: $(pwd)"
          echo "Build directory: $CM_BUILD_DIR"
          echo "Android project directory: $ANDROID_PROJECT_DIR"
          
          echo "=== SEARCHING FOR APK FILES ==="
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "Found APK: $apk"
            ls -lh "$apk"
          done
          
          echo "=== SEARCHING FOR BUILD OUTPUTS ==="
          find . -path "*/build/outputs/*" -type f 2>/dev/null | head -10
          
          echo "=== SEARCHING FOR REPORTS ==="
          find . -path "*/build/reports/*" -type f 2>/dev/null | head -10
          
          echo "=== COPYING ARTIFACTS TO ROOT LEVEL ==="
          # Create artifacts directory at root level for Codemagic
          mkdir -p "$CM_BUILD_DIR/artifacts"
          
          # Copy APK files
          find . -name "*.apk" -type f -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || echo "No APK files found"
          
          # Copy build artifacts
          if [ -d "build-artifacts" ]; then
            cp -r build-artifacts/* "$CM_BUILD_DIR/artifacts/" 2>/dev/null || echo "No build artifacts found"
          fi
          
          # Copy reports
          find . -path "*/build/reports/*" -name "*.html" -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || echo "No HTML reports found"
          find . -path "*/build/reports/*" -name "*.xml" -exec cp {} "$CM_BUILD_DIR/artifacts/" \; 2>/dev/null || echo "No XML reports found"
          
          echo "=== FINAL ARTIFACT LISTING ==="
          echo "Artifacts in $CM_BUILD_DIR/artifacts:"
          ls -la "$CM_BUILD_DIR/artifacts/" 2>/dev/null || echo "Artifacts directory is empty"
          
          echo "Total artifact files: $(find "$CM_BUILD_DIR/artifacts/" -type f 2>/dev/null | wc -l)"
    
    artifacts:
      # Root level artifacts (copied by debug script)
      - artifacts/**/*
      # Direct paths from project directory
      - myCoolApp/build-artifacts/**/*
      - myCoolApp/app/build/outputs/**/*.apk
      - myCoolApp/app/build/outputs/**/mapping.txt
      - myCoolApp/app/build/reports/**/*
    
    publishing:
      email:
        recipients:
          - dalessiof@gmail.com
        notify:
          success: true
          failure: true
        
      # Add Slack notifications if you have a workspace (optional)
      # slack:
      #   channel: '#builds'
