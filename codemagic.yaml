definitions:
  env_versions: &env_versions
    java: 11
    
workflows:
  android-workflow:
    name: Android OpenCV Camera Stream
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      <<: *env_versions
      vars:
        GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        # Android signing configuration (for release builds)
        # KEYSTORE: Encrypted(...)  # Add your keystore if needed
        # KEYSTORE_PASSWORD: Encrypted(...)
        # KEY_ALIAS: Encrypted(...)
        # KEY_PASSWORD: Encrypted(...)
      # groups:
        # Add environment variable groups if needed
        # - keystore_credentials
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.android/build-cache
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
        - pattern: 'feature/*'
          include: true
          source: true
    scripts:
      - name: Debug build environment
        script: |
          echo "=== COMPREHENSIVE DEBUG INFO ==="
          echo "Build directory: $CM_BUILD_DIR"
          echo "Current working directory: $(pwd)"
          echo ""
          echo "=== CONTENTS OF BUILD DIRECTORY ==="
          ls -la $CM_BUILD_DIR
          echo ""
          echo "=== SEARCHING FOR GRADLEW FILES ==="
          find $CM_BUILD_DIR -name "gradlew" -type f 2>/dev/null || echo "No gradlew files found"
          echo ""
          echo "=== SEARCHING FOR BUILD.GRADLE FILES ==="
          find $CM_BUILD_DIR -name "build.gradle" -type f 2>/dev/null || echo "No build.gradle files found"
          echo ""
          echo "=== DIRECTORY TREE (max depth 3) ==="
          find $CM_BUILD_DIR -maxdepth 3 -type d | head -20
          echo ""
          echo "=== CHECKING SPECIFIC PATHS ==="
          for path in "$CM_BUILD_DIR/myCoolApp" "$CM_BUILD_DIR/app" "$CM_BUILD_DIR"; do
            echo "Checking path: $path"
            if [ -d "$path" ]; then
              echo "  ✅ Directory exists"
              if [ -f "$path/gradlew" ]; then
                echo "  ✅ gradlew found at $path/gradlew"
              else
                echo "  ❌ gradlew not found at $path/gradlew"
              fi
            else
              echo "  ❌ Directory does not exist"
            fi
          done
      
      - name: Find and setup Android project
        script: |
          echo "=== FINDING ANDROID PROJECT DIRECTORY ==="
          
          # Look for build.gradle to identify Android project directory
          BUILD_GRADLE_PATH=$(find $CM_BUILD_DIR -name "build.gradle" -type f | grep -v "/app/build.gradle" | head -1)
          if [ -n "$BUILD_GRADLE_PATH" ]; then
            ANDROID_PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
            echo "✅ Found build.gradle at: $BUILD_GRADLE_PATH"
            echo "✅ Android project directory: $ANDROID_PROJECT_DIR"
            
            # Export for use in subsequent steps
            echo "export ANDROID_PROJECT_DIR='$ANDROID_PROJECT_DIR'" >> $CM_BUILD_DIR/android_env.sh
            
            # Set up local.properties
            cd "$ANDROID_PROJECT_DIR"
            echo "sdk.dir=$ANDROID_SDK_ROOT" > "local.properties"
            echo "✅ Created local.properties in $ANDROID_PROJECT_DIR"
            
            # Set up Gradle wrapper
            if [ -f "scripts/setup-gradle-wrapper.sh" ]; then
              echo "Setting up Gradle wrapper..."
              chmod +x scripts/setup-gradle-wrapper.sh
              ./scripts/setup-gradle-wrapper.sh
            fi
            
            # Check for gradlew and make it executable if it exists
            if [ -f "$ANDROID_PROJECT_DIR/gradlew" ]; then
              chmod +x "$ANDROID_PROJECT_DIR/gradlew"
              echo "✅ Made gradlew executable"
              
              # Test if gradlew works
              if ./gradlew --version >/dev/null 2>&1; then
                echo "✅ gradlew is working"
                echo "export USE_GRADLEW=true" >> $CM_BUILD_DIR/android_env.sh
              else
                echo "⚠️  gradlew exists but not working, will use system gradle"
                echo "export USE_GRADLEW=false" >> $CM_BUILD_DIR/android_env.sh
              fi
            else
              echo "⚠️  gradlew not found, will use system gradle"
              echo "export USE_GRADLEW=false" >> $CM_BUILD_DIR/android_env.sh
            fi
            
            # Verify setup
            echo "Contents of Android project directory:"
            ls -la "$ANDROID_PROJECT_DIR"
          else
            echo "❌ Could not find build.gradle file anywhere in the repository"
            echo "Repository structure:"
            find $CM_BUILD_DIR -type f -name "*.gradle" | head -10
            exit 1
          fi
      
      - name: Get Android dependencies
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          if [ "$USE_GRADLEW" = "true" ]; then
            ./gradlew dependencies
          else
            gradle dependencies
          fi
      
      - name: Set up OpenCV
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          # Verify OpenCV module is properly configured
          if [ ! -d "opencv/src" ]; then
            echo "Warning: OpenCV module not found. This may cause build issues."
          fi
      
      - name: Build debug APK
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          if [ "$USE_GRADLEW" = "true" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
      
      - name: Run unit tests
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          if [ "$USE_GRADLEW" = "true" ]; then
            ./gradlew testDebugUnitTest
          else
            gradle testDebugUnitTest
          fi
      
      - name: Run Android lint
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          if [ "$USE_GRADLEW" = "true" ]; then
            ./gradlew lintDebug
          else
            gradle lintDebug
          fi
      
      - name: Generate test reports
        script: |
          source $CM_BUILD_DIR/android_env.sh
          cd "$ANDROID_PROJECT_DIR"
          # Copy test results for artifacts
          mkdir -p test-results
          find . -name "TEST-*.xml" -exec cp {} test-results/ \;
          
          # Copy lint results
          mkdir -p lint-results
          find . -name "lint-results*.xml" -exec cp {} lint-results/ \;
          find . -name "lint-results*.html" -exec cp {} lint-results/ \;
    
    artifacts:
      - myCoolApp/app/build/outputs/**/*.apk
      - myCoolApp/app/build/outputs/**/mapping.txt
      - myCoolApp/app/build/reports/lint-results*.html
      - myCoolApp/app/build/reports/tests/**/*
      - myCoolApp/test-results/*.xml
      - myCoolApp/lint-results/*
    
    publishing:
      email:
        recipients:
          - dalessiof@gmail.com  
        notify:
          success: true
          failure: true
      
      # Uncomment to publish to Google Play (requires setup)
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  android-release-workflow:
    name: Android Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      <<: *env_versions
      vars:
        GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        # Add release-specific environment variables
      # groups:
        # - keystore_credentials  # Uncomment when you have signing setup
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.android/build-cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "local.properties"
      
      - name: Get Android dependencies
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          ./gradlew dependencies
      
      - name: Run all tests
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          ./gradlew testDebugUnitTest
          ./gradlew connectedAndroidTest || echo "No connected tests available"
      
      - name: Build release APK
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          # For now, build unsigned release APK
          # When you have signing setup, use: ./gradlew assembleRelease
          ./gradlew assembleDebug
      
      - name: Generate release artifacts
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/
          
          # Generate build info
          echo "Build Date: $(date)" > release-artifacts/build-info.txt
          echo "Git Commit: $CM_COMMIT" >> release-artifacts/build-info.txt
          echo "Git Branch: $CM_BRANCH" >> release-artifacts/build-info.txt
          echo "Build Number: $CM_BUILD_ID" >> release-artifacts/build-info.txt
    
    artifacts:
      - myCoolApp/release-artifacts/*.apk
      - myCoolApp/release-artifacts/build-info.txt
      - myCoolApp/app/build/outputs/**/mapping.txt
      - myCoolApp/app/build/reports/**/*
    
    publishing:
      email:
        recipients:
          - dalessiof@gmail.com 
        notify:
          success: true
          failure: true

  android-test-workflow:
    name: Android Tests Only
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      <<: *env_versions
    cache:
      cache_paths:
        - ~/.gradle/caches
    triggering:
      events:
        - pull_request
    scripts:
      - name: Set up local.properties
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "local.properties"
      
      - name: Run unit tests with coverage
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          ./gradlew testDebugUnitTest jacocoTestReport
      
      - name: Run lint checks
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          ./gradlew lintDebug
      
      - name: Validate Android 10 compatibility
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          # Check that target SDK is 29 (Android 10)
          if grep -q "targetSdk 29" app/build.gradle; then
            echo "✅ Target SDK 29 (Android 10) confirmed"
          else
            echo "❌ Target SDK should be 29 for Android 10 compatibility"
            exit 1
          fi
          
          # Check for required permissions
          if grep -q "android.permission.CAMERA" app/src/main/AndroidManifest.xml; then
            echo "✅ Camera permission declared"
          else
            echo "❌ Camera permission not found in manifest"
            exit 1
          fi
      
      - name: Generate test coverage report
        script: |
          cd $CM_BUILD_DIR/myCoolApp
          mkdir -p coverage-reports
          find . -name "jacoco*.xml" -exec cp {} coverage-reports/ \;
          find . -name "jacoco*.html" -exec cp -r {} coverage-reports/ \;
    
    artifacts:
      - myCoolApp/app/build/reports/tests/**/*
      - myCoolApp/app/build/reports/lint-results*.html
      - myCoolApp/coverage-reports/**/*
    
    publishing:
      email:
        recipients:
          - dalessiof@gmail.com
        notify:
          success: false
          failure: true