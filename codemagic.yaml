workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.example.distancecamera"
      java: 11
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Download OpenCV Android SDK
        script: |
          cd opencv
          curl -L -o opencv-4120-android-sdk.aar "https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-android-sdk.zip"
          unzip -j opencv-4.12.0-android-sdk.zip "OpenCV-android-sdk/sdk/opencv-4120-android-sdk.aar" || echo "Using zip as AAR"
          mv opencv-4.12.0-android-sdk.zip opencv-4120-android-sdk.aar 2>/dev/null || true
      - name: Get Flutter dependencies
        script: |
          # Skip if not a Flutter project
          if [ -f "pubspec.yaml" ]; then
            flutter packages pub get
          fi
      - name: Build APK
        script: |
          gradle assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: false