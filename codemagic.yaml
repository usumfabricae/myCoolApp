              echo '    int INIT_FAILED = -1;' >> opencv/src/main/java/org/opencv/android/LoaderCallbackInterface.java
              echo '    int INSTALL_CANCELED = -2;' >> opencv/src/main/java/org/opencv/android/LoaderCallbackInterface.java
              echo '    int INCOMPATIBLE_MANAGER_VERSION = -3;' >> opencv/src/main/java/org/opencv/android/LoaderCallbackInterface.java
              echo '    int MARKET_ERROR = -4;' >> opencv/src/main/java/org/opencv/android/LoaderCallbackInterface.java
              echo '    void onManagerConnected(int status);' >> opencv/src/main/java/org/opencv/android/LoaderCallbackInterface.java
              echo '}' >> opencv/src/main/java/org/opencv/android/LoaderCallbackInterface.java
              
