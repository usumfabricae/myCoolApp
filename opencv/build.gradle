plugins {
    id 'com.android.library'
}

android {
    namespace 'org.opencv'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    sourceSets {
        main {
            // Native libraries are moved to app module during CI/CD to avoid duplicates
            // jniLibs.srcDirs = ['src/main/jniLibs']  // Commented out to prevent duplicate resources
        }
    }
    
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libopencv_java4.so'
        pickFirst '**/libopencv_java3.so'
        
        // Ensure native libraries are not stripped
        doNotStrip '**/libc++_shared.so'
        doNotStrip '**/libopencv_java4.so'
    }
    
    lint {
        // Disable lint abort on error for CI/CD
        abortOnError false
        
        // Create baseline for existing issues
        baseline = file("lint-baseline.xml")
        
        // Disable problematic checks for OpenCV module
        disable 'MissingPermission', 'InvalidPackage'
        
        // Skip lint for external dependencies
        checkDependencies false
        
        // Generate reports but don't fail build
        htmlReport true
        xmlReport true
        
        // Treat all issues as warnings
        warningsAsErrors false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}