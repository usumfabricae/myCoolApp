plugins {
    id 'com.android.library'
}

android {
    namespace 'org.opencv'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    
    packagingOptions {
        pickFirst '**/libopencv_java4.so'
        pickFirst '**/libopencv_java3.so'
        
        // Exclude libc++_shared.so to force static linking
        exclude '**/libc++_shared.so'
    }
    
    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        
        // Configure to use static C++ standard library
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }
    
    lint {
        // Disable lint abort on error for CI/CD
        abortOnError false
        
        // Create baseline for existing issues
        baseline = file("lint-baseline.xml")
        
        // Disable problematic checks for OpenCV module
        disable 'MissingPermission', 'InvalidPackage'
        
        // Skip lint for external dependencies
        checkDependencies false
        
        // Generate reports but don't fail build
        htmlReport true
        xmlReport true
        
        // Treat all issues as warnings
        warningsAsErrors false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}